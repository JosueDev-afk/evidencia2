<rect x="405" y="1060" width="230" height="46" rx="23.0" fill="#0E6B58"/>
<text x="520" y="1089.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Fin</text>
