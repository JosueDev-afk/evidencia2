<text x="145.0" y="350.0" class="e" text-anchor="middle">La biblioteca está llena.</text>
<text x="145.0" y="368.0" class="e" text-anchor="middle">No se agrega el libro</text>
<line x1="305" y1="354.0" x2="273" y2="354.0" stroke="#8A5A12" stroke-width="1.5" marker-end="url(#ae)"/>
