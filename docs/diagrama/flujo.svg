<text x="145.0" y="730.0" class="e" text-anchor="middle">Todavía no hay libros</text>
<text x="145.0" y="748.0" class="e" text-anchor="middle">registrados</text>
<line x1="305" y1="734.0" x2="273" y2="734.0" stroke="#8A5A12" stroke-width="1.5" marker-end="url(#ae)"/>
<text x="287.5" y="726.0" class="lble" text-anchor="middle">Sí</text>
<text x="530" y="794" class="lbl">No</text>
